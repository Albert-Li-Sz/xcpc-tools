name: Build and release
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global corepack && corepack enable
      - run: yarn install --immutable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: yarn check
      - name: Build Tools Core
        run: yarn build
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
      - name: Build Machine Tools App
        run: |
          cd packages/machine-tools
          yarn neu update
          yarn neu build --clean

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global corepack && corepack enable
      - run: yarn install --immutable
      - name: Build
        run: yarn build:pkg
      - name: Copy Origin Bundle to Dist
        run: cp dist/xcpc-tools.js /tmp/xcpc-tools-bundle.js
      - name: Create Zip for Windows
        run: zip -r /tmp/xcpc-tools-win.zip dist/pkg/xcpc-tools-win.exe
      - name: Create Tar for MacOS
        run: tar -czvf /tmp/xcpc-tools-macos.tar.gz dist/pkg/xcpc-tools-macos
      - name: Create Tar for Linux
        run: tar -czvf /tmp/xcpc-tools-linux.tar.gz dist/pkg/xcpc-tools-linux
      - name: Build Machine Tools App
        run: |
          cd packages/machine-tools
          yarn neu update
          yarn neu build --clean
      - name: Create Tar for Machine Tools
        run: |
          cp scripts/machine_tools_probe.py packages/machine-tools/dist/hydro-machine-tools/
          cp scripts/hydro-machine-tools.service packages/machine-tools/dist/hydro-machine-tools/
          cd packages/machine-tools/dist/hydro-machine-tools
          chmod +x hydro-machine-tools-linux_* machine_tools_probe.py
          tar -czvf /tmp/xcpc-tools-machine-tools-linux.tar.gz \
            resources.neu hydro-machine-tools-linux_* machine_tools_probe.py hydro-machine-tools.service
      - name: Generate release checksums
        working-directory: /tmp
        run: |
          sha256sum xcpc-tools-bundle.js xcpc-tools-win.zip xcpc-tools-macos.tar.gz \
            xcpc-tools-linux.tar.gz xcpc-tools-machine-tools-linux.tar.gz > SHA256SUMS
      - name: Get release version and commit
        id: tag
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./packages/server/package.json').version")" >> $GITHUB_OUTPUT
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}-${{ steps.tag.outputs.sha_short }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            /tmp/xcpc-tools-bundle.js
            /tmp/xcpc-tools-win.zip
            /tmp/xcpc-tools-macos.tar.gz
            /tmp/xcpc-tools-linux.tar.gz
            /tmp/xcpc-tools-machine-tools-linux.tar.gz
            /tmp/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
